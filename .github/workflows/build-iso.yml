name: Build DOT-OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build ISO
        run: |
          sed -i 's/\r$//' wsl-dot-os-builder.sh
          sed -i 's/^set -e$/set -eo pipefail/' wsl-dot-os-builder.sh
          chmod +x wsl-dot-os-builder.sh
          ./wsl-dot-os-builder.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DOT-OS-i386-iso
          path: /home/runner/dot-os-build/live-image-i386.hybrid.iso
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /home/runner/dot-os-build/build.log
          if-no-files-found: ignore
